spring.application.name=ORDER-SERVICE

server.port= 9010

server.servlet.context-path=/api/v1

# Core Database Connection Properties
spring.datasource.url=jdbc:postgresql://localhost:5432/orders
spring.datasource.username=niraj

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.sql.init.mode=always
#spring.jpa.defer-datasource-initialization=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

#circuit breaker properties
resilience4j.circuitbreaker.instances.inventoryService.register-health-indicator=true
resilience4j.circuitbreaker.instances.inventoryService.sliding-window-size=8
resilience4j.circuitbreaker.instances.inventoryService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventoryService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.inventoryService.permitted-number-of-calls-in-half-open-state=3

#Retry Properties
resilience4j.retry.instances.inventoryService.max-attempts=3

resilience4j.retry.instances.inventoryService.wait-duration=2s

#Rate Limiter

resilience4j.ratelimiter.instances.inventoryService.limit-for-period=10

resilience4j.ratelimiter.instances.inventoryService.limit-refresh-period=1m

resilience4j.ratelimiter.instances.inventoryService.timeout-duration=0
